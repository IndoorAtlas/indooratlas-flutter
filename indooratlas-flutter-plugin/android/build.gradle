group 'com.indooratlas.flutter'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.4.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
           url "https://dl.cloudsmith.io/public/indooratlas/mvn-public/maven/"
        }
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.indooratlas.flutter'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdk 24
        consumerProguardFiles 'proguard-rules.pro'
    }
}

// The Kotlin Android plugin is intentionally not applied here. When the host app disables
// built-in Kotlin (android.builtInKotlin=false) the Flutter Gradle plugin applies it to this
// library before this script is evaluated. Applying it here makes Flutter warn about plugins using KGP.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'com.indooratlas.android:indooratlas-android-sdk:3.4.12'
}
